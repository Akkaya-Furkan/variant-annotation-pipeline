[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "variant-annotation-pipeline"
version = "0.1.0"
description = "Reproducible small-VCF annotation against a local ClinVar snapshot"
requires-python = ">=3.11"
dependencies = ["matplotlib==3.10.7"]

[project.scripts]
annotate-variants = "variant_annotation.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
